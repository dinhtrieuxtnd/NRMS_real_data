preprocessing:
  name: real_nrms_fasttext_vi
  seed: 42

input:
  train_behaviors: data/raw/behaviors/train_behaviors.csv
  train_news: data/raw/news/train_news.csv
  validation_behaviors: data/raw/behaviors/val_behaviors.csv
  validation_news: data/raw/news/val_news.csv
  test_behaviors: data/raw/behaviors/test_behaviors.csv
  test_news: data/raw/news/test_news.csv
  word_vectors: data/raw/fasttext/cc.vi.300.vec

output:
  directory: data/processed/real_nrms_fasttext_vi
  overwrite: false

text:
  lowercase: true
  min_frequency: 1
  max_title_length: 30

sequence:
  max_history_length: 50
  deduplicate_history: true

training:
  negative_sampling_ratio: 4

embedding:
  dimension: 300
  unmatched_init_std: 0.1

logging:
  level: INFO
